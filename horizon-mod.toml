id = "bettermineshafts"
name = "YUNG's Better Mineshafts"
version = "0.2.0"
description = """YUNG's Better Mineshafts 5.1.1 for Horizon: the mod's own mineshaft geometry, generated in
Rust behind an SDK structure type. The jar has no templates at all (0 .nbt, 0 pools, 0 processor
lists) — its mineshaft is a Java structure type that builds ten piece classes in code — so this
port carries the jar's thirteen structure definitions with their per-variant palettes and writes
the geometry itself: a vertical entrance shaft with ladder and doorway, a 9x8x24 main corridor with
planks, fence supports, rails, lanterns, cobwebs and gravel piles, a 5x5x8 branch corridor and a
10x5x5 workstation room, from the seed and the structure's own config. The other pieces (stairs,
turns, layered intersections, ore deposits, zombie-villager rooms, surface tunnels, minecarts and
biome decorations) are recorded gaps in notes.md."""
authors = ["YUNGNICKYOUNG", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: the pieces are placed on the worldgen worker,
# which belongs to the server (an integrated server in single-player needs the same code).
side = "both"
# "May add blocks, items, mob effects and entity types": this mod adds none — it places vanilla
# blocks — but the SDK has one shared capabilities value and every package declares it.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
