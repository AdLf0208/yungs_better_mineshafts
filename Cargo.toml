[package]
# Port of YUNG's Better Mineshafts 5.1.1 (YUNGNICKYOUNG, LGPL-3.0-only), Minecraft Java 1.21.1
# NeoForge; the port targets Horizon 26.3 at the SDK pin in horizon-mod.toml. Clean-room Rust
# rewrite from the mod's behaviour (notes.md, FINDINGS.md): no Java was translated.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "bettermineshafts"
version = "0.2.2"
edition = "2024"
license = "LGPL-3.0-only"
description = "YUNG's Better Mineshafts for Horizon: the mod's mineshaft geometry, generated in Rust"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
